<P class=MsoNormal

<P class=MsoNormal 
align=justify><SPAN>描述：</SPAN><SPAN>MR1使用的果實，全身化爲鋒利的刀劍，無堅不摧，威力絕倫。</SPAN><SPAN></SPAN></P>
<P class=MsoNormal

align=justify><SPAN>刀刃化：你的全身皆可視爲天生武器，其可以造成揮砍和穿刺傷害。天生武器傷害爲6L，破甲9.</SPAN><SPAN></SPAN></P>

align=justify><SPAN>堅固無比：你獲得12點天生防禦，你獲得6點抵破甲，同時你的身體獲得4點硬度。當你受到擁有破甲值的攻擊時，對方在計算你的盔甲防禦，盾牌防禦，天生防禦後若還有剩餘，則可以破除本硬度。</SPAN><SPAN></SPAN></P>
<P class=MsoNormal 
align=justify><SPAN>拳刃同體：你可以用天生武器發動前提爲“刀”或者“劍”的招式。</SPAN><SPAN></SPAN></P><!--EndFragment--></body>
