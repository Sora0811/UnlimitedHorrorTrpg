<P 
class=MsoNormal><SPAN>感知靈體：你能夠感受靈體。你獲得靈視，可以聽到靈體的聲音。你可以被靈體觸碰或觸碰靈體，但這只是讓你能夠以觸覺感受靈體的存在，你依然會正常地穿過靈體，因此你不能以此方法對靈體進行攻擊。靈體自身會散發出靈波，因此即使你沒有黑暗視覺，你依然可以在黑夜、無光的密室看見靈體。但煙霧、水或有色的氣體等，及超自然性質的黑暗會遮住靈光。
